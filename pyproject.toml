[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gravlang"
version = "1.0.0.1"
description = "A lightweight, modern dynamic programming language and custom IDE environment."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Divyansh"}
]
keywords = ["programming-language", "interpreter", "ide", "lexer", "parser", "gui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
gravlang = "gravlang.__main__:main"
gravlang-ide = "gravlang.ide.main_window:launch_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["gravlang*"]

[tool.pyright]
extraPaths = [".", "tests"]
executionEnvironments = [
  { root = "." }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
